<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Student Dashboard - EduFlow</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .user-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .user-info h3 {
            margin: 0 0 5px 0;
        }
        .user-info p {
            margin: 0;
            opacity: 0.9;
            font-size: 14px;
        }
        .error-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f44336;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .schedule-table th, .schedule-table td {
            min-width: 120px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-nav">
            <div class="logo-area">
                <h2>📚 EduFlow</h2>
                <span>Student Portal</span>
            </div>
            <div class="nav-links">
                <a href="#">Dashboard</a>
                <a href="#">My Schedule</a>
                <a href="#">Courses</a>
                <a href="#" onclick="logout()" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="dashboard-header">
            <div class="header-info">
                <div class="role-badge">🧑‍🎓 Student</div>
                <div class="date-box" id="currentDate"></div>
            </div>
            <div class="filter-controls">
                <input type="text" id="searchFilter" placeholder="🔍 Search course or room...">
            </div>
        </div>

        <div class="user-info">
            <h3 id="userName">Loading...</h3>
            <p>Roll No: <span id="userRollNo">-</span> | Batch: <span id="userBatch">-</span> | Semester: <span id="userSemester">-</span></p>
        </div>

        <div class="dashboard-main">
            <div class="schedule-wrapper">
                <div class="schedule-grid-container">
                    <table class="schedule-table">
                        <thead id="tableHeader">
                            <tr>
                                <th>Date</th>
                                <!-- Header will be dynamically populated by JavaScript -->
                            </tr>
                        </thead>
                        <tbody id="scheduleBody">
                            <tr><td colspan="4" style="text-align: center;">Loading schedule...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="details-panel">
                <h3>📋 Class Details</h3>
                <div id="detailsContent">
                    <div class="no-selection">✨ Select a class to view details</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/studentDashboard.js"></script>
</body>
</html>
