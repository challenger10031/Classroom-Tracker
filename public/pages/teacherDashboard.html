<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Teacher Dashboard - EduFlow</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <nav class="top-nav">
            <div class="logo-area">
                <h2>📚 EduFlow</h2>
                <span>Teacher Portal</span>
            </div>
            <div class="nav-links">
                <a href="#">Dashboard</a>
                <a href="#">My Courses</a>
                <a href="#">Schedule</a>
                <span onclick="logout()" class="logout-btn">Logout</span>
            </div>
        </nav>

        <!-- Dashboard Header -->
        <header class="dashboard-header">
            <div class="header-info">
                <div class="role-badge">👨‍🏫 Teacher</div>
                <div class="date-box" id="currentDate"></div>
            </div>
            <div class="filter-controls">
                <input type="text" id="searchFilter" placeholder="🔍 Search course or room...">
            </div>
            <button class="schedule-class-btn" onclick="openScheduleModalForToday()">+ Schedule Class</button>
        </header>

        <!-- User Info -->
        <div class="user-info teacher">
            <h3 id="userName">Loading...</h3>
            <p>Department: <span id="userDepartment">-</span></p>
        </div>

        <!-- Main Content -->
        <div class="dashboard-main">
            <!-- Schedule Grid -->
            <div class="schedule-wrapper">
                <div class="schedule-grid-container">
                    <table class="schedule-table">
                        <thead id="tableHeader">
                            <tr>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody">
                            <tr><td colspan="6" style="text-align: center; padding: 40px;">Loading schedule...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Details Panel -->
            <div class="details-panel">
                <h3>📋 Class Details</h3>
                <div id="detailsContent">
                    <div class="no-selection">✨ Select a class<br>to view details</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/teacherDashboard.js"></script>
</body>
</html>
